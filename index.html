<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>チェックリスト</title>
  <meta
    name="description"
    content="カテゴリと項目を管理しながら、今回使う項目を選んで進行状況をチェックできるチェックリストです。"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="チェックリスト" />
  <link rel="apple-touch-icon" href="img/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-menu">
        <button
          id="menu-toggle-btn"
          class="app-menu__toggle"
          type="button"
          aria-label="画面切替メニューを開く"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="app-menu-dropdown"
          onclick="toggleAppMenu(event)"
        >
          <span class="app-menu__toggle-line" aria-hidden="true"></span>
          <span class="app-menu__toggle-line" aria-hidden="true"></span>
          <span class="app-menu__toggle-line" aria-hidden="true"></span>
        </button>
        <div id="app-menu-dropdown" class="app-menu__dropdown" role="menu" aria-label="画面切替">
          <div class="app-menu__section">
            <div class="app-menu__section-title">画面</div>
            <button
              id="menu-list"
              class="app-menu__item app-menu__item--active"
              type="button"
              data-tab="list"
              role="menuitem"
              onclick="handleTabClick('list')"
            >
              項目リスト
            </button>
            <button
              id="menu-items"
              class="app-menu__item"
              type="button"
              data-tab="items"
              role="menuitem"
              onclick="handleTabClick('items')"
            >
              項目管理
            </button>
            <button
              id="menu-categories"
              class="app-menu__item"
              type="button"
              data-tab="categories"
              role="menuitem"
              onclick="handleTabClick('categories')"
            >
              カテゴリ管理
            </button>
          </div>
          <div class="app-menu__section">
            <div class="app-menu__section-title">表示設定</div>
            <label class="app-menu__setting" role="menuitem">
              <input
                id="setting-show-category-labels"
                type="checkbox"
                onchange="handleToggleCategoryLabelsSetting(this.checked)"
              />
              <span>カテゴリ名を表示</span>
              <button
                id="category-label-setting-help"
                class="app-menu__setting-help"
                type="button"
                aria-label="カテゴリ名表示設定の説明を表示"
                aria-expanded="false"
                onclick="toggleCategoryLabelSettingHelp(event)"
              >
                ?
              </button>
            </label>
            <label class="app-menu__setting" role="menuitem">
              <input
                id="setting-move-purchased-to-bottom"
                type="checkbox"
                onchange="handleToggleMovePurchasedToBottomSetting(this.checked)"
              />
              <span>完了済みを下へ移動</span>
              <button
                id="move-purchased-setting-help"
                class="app-menu__setting-help"
                type="button"
                aria-label="完了済み移動設定の説明を表示"
                aria-expanded="false"
                onclick="toggleMovePurchasedSettingHelp(event)"
              >
                ?
              </button>
            </label>
            <div class="app-menu__setting app-menu__setting--columns" role="group" aria-label="表示列数">
              <div class="app-menu__setting-label-row">
                <span class="app-menu__setting-label">表示列数</span>
                <button
                  id="display-columns-setting-help"
                  class="app-menu__setting-help"
                  type="button"
                  aria-label="3列表示の見方を表示"
                  aria-expanded="false"
                  onclick="toggleThreeColumnHelpTooltip(event)"
                >
                  ?
                </button>
              </div>
              <div class="app-menu__segmented" aria-label="項目リストの表示列数">
                <label class="app-menu__segment">
                  <input
                    type="radio"
                    name="setting-display-columns"
                    value="1"
                    onchange="handleDisplayColumnsSettingChange(this.value)"
                  />
                  <span>1列</span>
                </label>
                <label class="app-menu__segment">
                  <input
                    type="radio"
                    name="setting-display-columns"
                    value="2"
                    onchange="handleDisplayColumnsSettingChange(this.value)"
                  />
                  <span>2列</span>
                </label>
                <label class="app-menu__segment">
                  <input
                    type="radio"
                    name="setting-display-columns"
                    value="3"
                    onchange="handleDisplayColumnsSettingChange(this.value)"
                  />
                  <span>3列</span>
                </label>
              </div>
            </div>
          </div>
          <div id="category-label-setting-tooltip" class="app-menu__setting-tooltip" role="tooltip">
            準備モード・実行モードの項目にカテゴリ名を表示します。<br />
            項目管理では、確認のため常にカテゴリ名を表示します。
          </div>
          <div id="move-purchased-setting-tooltip" class="app-menu__setting-tooltip" role="tooltip">
            チェック後に完了済み項目を下へ移動します。<br />
            OFFでは位置を固定します。
          </div>
          <div id="three-column-help-tooltip" class="app-menu__setting-tooltip app-menu__setting-tooltip--media" role="tooltip">
            <strong class="three-column-help__title">3列表示の見方</strong>
            <img class="three-column-help__image" src="img/3colum_help.webp" alt="3列表示のチェック順" />
            <span class="three-column-help__text">矢印の順にチェックします</span>
          </div>
          <div class="app-menu__section">
            <div class="app-menu__section-title">データ管理</div>
            <button
              id="menu-export"
              class="app-menu__item"
              type="button"
              role="menuitem"
              onclick="handleExportBackup()"
            >
              バックアップをエクスポート
            </button>
            <button
              id="menu-import"
              class="app-menu__item"
              type="button"
              role="menuitem"
              onclick="triggerImportBackup()"
            >
              バックアップをインポート
            </button>
          </div>
          <div class="app-menu__section">
            <div class="app-menu__section-title">ヘルプ</div>
            <button
              id="menu-onboarding"
              class="app-menu__item"
              type="button"
              role="menuitem"
              onclick="openOnboardingGuide()"
            >
              使い方を見る
            </button>
          </div>
          <div id="appVersionLabel" class="app-menu__version" aria-label="アプリバージョン"></div>
        </div>
      </div>
      <div id="appHeaderContent" class="app-header__content"></div>
    </header>

    <section id="panel-list" class="tab-panel tab-panel--active" role="tabpanel" aria-labelledby="menu-list">
      <div id="list-content"></div>
    </section>

    <section id="panel-items" class="tab-panel" role="tabpanel" aria-labelledby="menu-items">
      <div class="panel-header">
        <div class="panel-header__actions management-actions">
          <button id="bulk-add-btn" class="btn btn--ghost btn--sm" onclick="openBulkAddModal()">
            一括追加
          </button>
          <button id="toggle-item-delete-mode-btn" class="btn btn--ghost btn--sm" onclick="handleToggleItemDeleteMode()">
            一括削除
          </button>
          <button id="add-item-btn" class="btn btn--primary" onclick="openAddItemModal()">
            項目を追加
          </button>
        </div>
      </div>
      <div id="items-content"></div>
    </section>

    <section id="panel-categories" class="tab-panel" role="tabpanel" aria-labelledby="menu-categories">
      <div class="panel-header">
        <div class="panel-header__actions management-actions">
          <button id="category-bulk-open-btn" class="btn btn--ghost btn--sm" onclick="openCategoryBulkModal()">
            一括追加
          </button>
          <button id="toggle-category-delete-mode-btn" class="btn btn--ghost btn--sm" onclick="handleToggleCategoryDeleteMode()">
            一括削除
          </button>
          <button id="add-category-btn" class="btn btn--primary" onclick="openAddCategoryModal()">
            カテゴリを追加
          </button>
        </div>
      </div>

      <div id="category-bulk-result" class="bulk-result" style="display:none"></div>

      <div id="categories-content"></div>
    </section>
  </div>

  <div id="cat-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="cat-modal-title">
    <div class="modal__box">
      <h2 id="cat-modal-title" class="modal__title">カテゴリを追加</h2>
      <form id="cat-form" novalidate>
        <div class="form-group">
          <label for="cat-name">カテゴリ名</label>
          <input id="cat-name" type="text" placeholder="例: 買い物" maxlength="50" required />
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" onclick="closeModal('cat-modal')">キャンセル</button>
          <button id="cat-submit-btn" type="submit" class="btn btn--primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="item-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="item-modal-title">
    <div class="modal__box">
      <h2 id="item-modal-title" class="modal__title">項目を追加</h2>
      <form id="item-form" novalidate>
        <div class="form-group">
          <label for="item-name">項目名</label>
          <input id="item-name" type="text" placeholder="例: 牛乳" maxlength="80" required />
        </div>
        <div class="form-group">
          <label for="item-category">カテゴリ</label>
          <select id="item-category">
            <option value="">-- カテゴリなし --</option>
          </select>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" onclick="closeModal('item-modal')">キャンセル</button>
          <button id="item-submit-btn" type="submit" class="btn btn--primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="confirm-modal" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
    <div class="modal__box modal__box--sm">
      <p id="confirm-message" class="confirm-message"></p>
      <div class="modal__actions">
        <button id="confirm-cancel-btn" class="btn btn--ghost">キャンセル</button>
        <button id="confirm-ok-btn" class="btn btn--danger">削除する</button>
      </div>
    </div>
  </div>

  <div id="bulk-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="bulk-modal-title">
    <div class="modal__box modal__box--lg">
      <h2 id="bulk-modal-title" class="modal__title">項目を一括追加</h2>
      <p class="modal__desc">1行ごとに1項目を入力してください。</p>
      <p class="modal__format"><code>項目名,カテゴリ名</code></p>
      <div class="form-group">
        <label for="bulk-text">項目リスト</label>
        <textarea id="bulk-text" class="bulk-textarea" rows="10" placeholder="牛乳,買い物&#10;卵,買い物&#10;トイレットペーパー,買い物"></textarea>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" onclick="closeModal('bulk-modal')">キャンセル</button>
        <button id="bulk-submit-btn" type="button" class="btn btn--primary" onclick="handleBulkAdd()">追加する</button>
      </div>
    </div>
  </div>

  <div id="category-bulk-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="category-bulk-modal-title">
    <div class="modal__box modal__box--lg">
      <h2 id="category-bulk-modal-title" class="modal__title">カテゴリを一括追加</h2>
      <p class="modal__desc">1行ごとに1カテゴリを入力してください。</p>
      <p class="modal__format"><code>カテゴリ名</code></p>
      <div class="form-group">
        <label for="category-bulk-text">カテゴリリスト</label>
        <textarea id="category-bulk-text" class="bulk-textarea" rows="8" placeholder="買い物&#10;持ち物&#10;毎日の習慣"></textarea>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" onclick="closeCategoryBulkModal()">キャンセル</button>
        <button type="button" class="btn btn--primary" onclick="handleBulkAddCategories()">追加する</button>
      </div>
    </div>
  </div>

  <div id="three-column-help-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="three-column-help-modal-title">
    <div class="modal__box modal__box--sm modal__box--help">
      <h2 id="three-column-help-modal-title" class="modal__title three-column-help__title">3列表示の見方</h2>
      <img class="three-column-help__image" src="img/3colum_help.webp" alt="3列表示のチェック順" />
      <p class="three-column-help__text">矢印の順にチェックします</p>
      <div class="modal__actions modal__actions--compact">
        <button type="button" class="btn btn--primary" onclick="closeModal('three-column-help-modal')">OK</button>
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>
  <input id="import-file-input" type="file" accept="application/json" style="display:none" onchange="handleImportFileSelected(event)" />

  <script src="script.js"></script>
  
  <script>
    window.addEventListener('load', () => {
      if (!('serviceWorker' in navigator)) return;
      const registerServiceWorker = () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      };
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(registerServiceWorker, { timeout: 2000 });
      } else {
        window.setTimeout(registerServiceWorker, 500);
      }
    });
  </script>
</body>
</html>
